<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Từ Vựng Tiếng Anh - At the Castle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #8b4513;
      margin-bottom: 20px;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(255,255,255,0.6);
    }

    .card {
      width: 340px;
      height: 420px;
      background: #ffffff;
      border-radius: 25px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      border: 5px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .icon {
      font-size: 5rem;
      margin-top: 10px;
    }

    .text-container {
      text-align: center;
    }

    .word {
      font-size: 2rem;
      font-weight: bold;
      color: #d35400;
      margin-bottom: 8px;
    }

    .meaning {
      font-size: 1.4rem;
      font-weight: bold;
      color: #8b4513;
    }

    .btn-audio {
      background: #d35400;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(211, 84, 0, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-audio:hover {
      background: #e67e22;
      transform: scale(1.05);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn-nav {
      background: #8b4513;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(139, 69, 19, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background: #a0522d;
      transform: scale(1.05);
    }

    .progress {
      font-size: 1.2rem;
      font-weight: bold;
      color: #8b4513;
      background: rgba(255,255,255,0.9);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>🏰 At the Castle Vocabulary 👑</h1>

  <div class="card">
    <div class="icon" id="icon">✨</div>
    
    <div class="text-container">
      <div class="word" id="word">appear</div>
      <div class="meaning" id="meaning">xuất hiện</div>
    </div>

    <button class="btn-audio" onclick="speakCurrentWord()">🔊 Nghe đọc</button>
  </div>

  <div class="controls">
    <button class="btn-nav" onclick="prevCard()">◄ Trước</button>
    <div class="progress" id="progress">1 / 46</div>
    <button class="btn-nav" onclick="nextCard()">Sau ►</button>
  </div>

  <script>
    const vocabulary = [
      { word: "appear", meaning: "xuất hiện", icon: "✨" },
      { word: "bridge", meaning: "cây cầu", icon: "🌉" },
      { word: "building", meaning: "tòa nhà / công trình", icon: "🏛️" },
      { word: "butterfly", meaning: "con bướm", icon: "🦋" },
      { word: "century", meaning: "thế kỷ", icon: "⏳" },
      { word: "conversation", meaning: "cuộc trò chuyện", icon: "💬" },
      { word: "costume", meaning: "trang phục / hóa trang", icon: "🎭" },
      { word: "creature", meaning: "sinh vật", icon: "🐉" },
      { word: "crown", meaning: "vương miện", icon: "👑" },
      { word: "date", meaning: "ngày tháng", icon: "📅" },
      { word: "design", meaning: "thiết kế", icon: "📐" },
      { word: "east", meaning: "phía đông", icon: "🧭" },
      { word: "entrance", meaning: "lối vào", icon: "🚪" },
      { word: "exit", meaning: "lối ra", icon: "🚪" },
      { word: "festival", meaning: "lễ hội", icon: "🎪" },
      { word: "finger", meaning: "ngón tay", icon: "☝️" },
      { word: "flag", meaning: "lá cờ", icon: "🚩" },
      { word: "follow", meaning: "đi theo", icon: "👣" },
      { word: "gate", meaning: "cổng", icon: "⛩️" },
      { word: "glass", meaning: "thủy tinh / cái ly", icon: "🍷" },
      { word: "gold", meaning: "vàng", icon: "🥇" },
      { word: "insect", meaning: "côn trùng", icon: "🐞" },
      { word: "interested", meaning: "hứng thú / quan tâm", icon: "😃" },
      { word: "journey", meaning: "hành trình / chuyến đi", icon: "🗺️" },
      { word: "king", meaning: "vua", icon: "🤴" },
      { word: "leave", meaning: "rời đi", icon: "🚶" },
      { word: "make sure", meaning: "đảm bảo / chắc chắn", icon: "✅" },
      { word: "might", meaning: "có thể", icon: "🤔" },
      { word: "north", meaning: "phía bắc", icon: "🧭" },
      { word: "postcard", meaning: "bưu thiếp", icon: "🖼️" },
      { word: "queen", meaning: "nữ hoàng / hoàng hậu", icon: "👸" },
      { word: "ring", meaning: "chiếc nhẫn", icon: "💍" },
      { word: "send", meaning: "gửi", icon: "✉️" },
      { word: "silver", meaning: "bạc", icon: "🥈" },
      { word: "south", meaning: "phía nam", icon: "🧭" },
      { word: "steps", meaning: "bậc thang / bước chân", icon: "🪜" },
      { word: "still", meaning: "vẫn / vẫn còn", icon: "⏱️" },
      { word: "swan", meaning: "chim thiên nga", icon: "🦢" },
      { word: "swing", meaning: "xích đu", icon: "🛝" },
      { word: "touch", meaning: "chạm vào", icon: "👉" },
      { word: "tour", meaning: "chuyến tham quan", icon: "🚌" },
      { word: "unusual", meaning: "bất thường / kỳ lạ", icon: "❓" },
      { word: "view", meaning: "tầm nhìn / quang cảnh", icon: "🏔️" },
      { word: "west", meaning: "phía tây", icon: "🧭" },
      { word: "wild", meaning: "hoang dã", icon: "🌿" },
      { word: "wonderful", meaning: "tuyệt vời", icon: "🌟" }
    ];

    let currentIndex = 0;
    const wordElement = document.getElementById('word');
    const meaningElement = document.getElementById('meaning');
    const iconElement = document.getElementById('icon');
    const progressElement = document.getElementById('progress');

    function updateCard() {
      const item = vocabulary[currentIndex];
      wordElement.textContent = item.word;
      meaningElement.textContent = item.meaning;
      iconElement.textContent = item.icon;
      progressElement.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < vocabulary.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function speakCurrentWord() {
      const textToSpeak = vocabulary[currentIndex].word.replace(/\(.*?\)/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    updateCard();
  </script>
</body>
</html>
